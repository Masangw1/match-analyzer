<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Match Analyzer</title><style>  * { box-sizing: border-box; margin: 0; padding: 0; }  :root {    --bg: #0d1117; --card: #161b22; --border: #30363d;    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;    --win: #3fb950; --draw: #d29922; --loss: #f85149;    --home: #58a6ff; --away: #f778ba;  }  body {    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;    background: var(--bg); color: var(--text); line-height: 1.5;    padding: 16px; max-width: 1100px; margin: 0 auto;  }  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }  h1 { font-size: 20px; font-weight: 600; }  h2 { font-size: 16px; font-weight: 600; margin: 20px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }  h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }  button {    background: var(--accent); color: white; border: none; padding: 8px 14px;    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;  }  button:hover { opacity: 0.85; }  button:disabled { opacity: 0.4; cursor: not-allowed; }  button.secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }  button.danger { background: var(--loss); }  button.small { padding: 4px 10px; font-size: 12px; }  input, select, textarea {    width: 100%; background: var(--bg); border: 1px solid var(--border);    color: var(--text); padding: 8px; border-radius: 6px; font-size: 14px;    font-family: inherit;  }  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }  .field { margin-bottom: 12px; }  .grid { display: grid; gap: 12px; }  .grid-2 { grid-template-columns: 1fr 1fr; }  .grid-3 { grid-template-columns: repeat(3, 1fr); }  .grid-4 { grid-template-columns: repeat(4, 1fr); }  .grid-6 { grid-template-columns: repeat(6, 1fr); }  @media (max-width: 700px) {    .grid-3, .grid-4, .grid-6 { grid-template-columns: repeat(2, 1fr); }  }  .card {    background: var(--card); border: 1px solid var(--border);    border-radius: 10px; padding: 16px; margin-bottom: 12px;  }  .fixture-card {    background: var(--card); border: 1px solid var(--border);    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;    cursor: pointer; transition: border-color 0.15s, transform 0.1s;    display: flex; justify-content: space-between; align-items: center; gap: 12px;  }  .fixture-card:hover { border-color: var(--accent); transform: translateY(-1px); }  .fixture-teams { font-size: 16px; font-weight: 600; }  .fixture-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }  .badge {    padding: 4px 10px; border-radius: 20px; font-size: 11px;    font-weight: 600; white-space: nowrap;  }  .badge-home { background: rgba(88,166,255,0.15); color: var(--home); border: 1px solid var(--home); }  .badge-away { background: rgba(247,120,186,0.15); color: var(--away); border: 1px solid var(--away); }  .badge-draw { background: rgba(210,153,34,0.15); color: var(--draw); border: 1px solid var(--draw); }  .badge-neutral { background: rgba(139,148,158,0.15); color: var(--muted); border: 1px solid var(--border); }  .form-dots { display: flex; gap: 3px; }  .form-dot {    width: 20px; height: 20px; border-radius: 4px;    display: flex; align-items: center; justify-content: center;    font-size: 10px; font-weight: 700; color: white;  }  .form-W { background: var(--win); }  .form-D { background: var(--draw); }  .form-L { background: var(--loss); }  .prob-bar { display: flex; height: 32px; border-radius: 6px; overflow: hidden; margin: 8px 0; }  .prob-seg { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }  .prob-home { background: var(--home); }  .prob-draw { background: var(--draw); }  .prob-away { background: var(--away); }  table { width: 100%; border-collapse: collapse; font-size: 13px; }  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }  tr:last-child td { border-bottom: none; }  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }  .stat-row:last-child { border-bottom: none; }  .stat-label { color: var(--muted); }  .stat-value { font-weight: 600; }  .heatmap { display: grid; grid-template-columns: 40px repeat(6, 1fr); gap: 2px; font-size: 11px; }  .heatmap-cell {    padding: 6px 2px; text-align: center; border-radius: 3px;    background: var(--bg); color: var(--muted); font-weight: 600;  }  .heatmap-header { background: transparent; color: var(--muted); font-weight: 700; }  .heatmap-0 { background: rgba(63,185,80,0.08); }  .heatmap-1 { background: rgba(63,185,80,0.20); }  .heatmap-2 { background: rgba(63,185,80,0.35); }  .heatmap-3 { background: rgba(63,185,80,0.55); color: white; }  .heatmap-4 { background: rgba(63,185,80,0.75); color: white; }  .back-btn { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; margin-bottom: 12px; }  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }  .prediction-box {    background: linear-gradient(135deg, rgba(47,129,247,0.1), rgba(47,129,247,0.02));    border: 1px solid var(--accent); border-radius: 8px; padding: 14px; margin-top: 12px;  }  .prediction-box h3 { color: var(--accent); margin-bottom: 8px; }  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 6px; }  .tag-value { background: rgba(63,185,80,0.15); color: var(--win); }  .tag-caution { background: rgba(248,81,73,0.15); color: var(--loss); }  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }  .copy-status { font-size: 12px; color: var(--win); margin-left: 8px; opacity: 0; transition: opacity 0.3s; }  .copy-status.show { opacity: 1; }  .section-divider { height: 1px; background: var(--border); margin: 20px 0; }  .muted { color: var(--muted); font-size: 13px; }  .quick-add { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: stretch; }  .quick-add textarea { flex: 1 1 200px; min-width: 0; resize: vertical; min-height: 38px; max-height: 120px; line-height: 1.4; padding: 8px 10px; font-family: inherit; }  .quick-add select { flex: 0 0 auto; width: auto; padding: 8px 10px; }  .quick-add button { flex: 0 0 auto; }  .status-msg { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }  .status-ok { background: rgba(63,185,80,0.1); color: var(--win); border: 1px solid rgba(63,185,80,0.3); }  .status-err { background: rgba(248,81,73,0.1); color: var(--loss); border: 1px solid rgba(248,81,73,0.3); }  .status-info { background: rgba(47,129,247,0.1); color: var(--accent); border: 1px solid rgba(47,129,247,0.3); }  .fetched-fixture {    display: flex; justify-content: space-between; align-items: center;    padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px;  }  .fetched-fixture:last-child { border-bottom: none; }  .fetched-fixture .teams { font-weight: 600; }  .fetched-fixture .time { color: var(--muted); font-size: 12px; }  .fetched-fixture button { font-size: 11px; padding: 4px 10px; }</style></head><body><div id="app"></div><script>const STORAGE_KEY = 'matchAnalyzer_fixtures_v1';const SETTINGS_KEY = 'matchAnalyzer_settings_v1';let state = {  fixtures: [],  view: 'list',  currentId: null,  editing: null,  settings: { apiKey: '', lastFetched: null, fetchedFixtures: [], quickAddFormat: 'auto' },  status: null,  loading: false};function load() {  try {    const raw = localStorage.getItem(STORAGE_KEY);    if (raw) state.fixtures = JSON.parse(raw);    const s = localStorage.getItem(SETTINGS_KEY);    if (s) state.settings = Object.assign(state.settings, JSON.parse(s));  } catch (e) { console.error('Load failed', e); }}function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.fixtures)); }function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }function uid() { return Math.random().toString(36).slice(2, 10); }function factorial(n) { if (n <= 1) return 1; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }function poissonPmf(k, lambda) { if (lambda <= 0) return k === 0 ? 1 : 0; return Math.exp(-lambda) * Math.pow(lambda, k) / factorial(k); }function calcXg(home, away, leagueAvg = 1.35) {  const hm = home.mp || 1, am = away.mp || 1;  const homeAttack = (home.gf || 0) / hm; const homeDefense = (home.ga || 0) / hm;  const awayAttack = (away.gf || 0) / am; const awayDefense = (away.ga || 0) / am;  const HOME_ADV = 1.15, AWAY_ADV = 0.90;  return { homeXg: Math.max(0.1, (homeAttack * awayDefense / leagueAvg) * HOME_ADV), awayXg: Math.max(0.1, (awayAttack * homeDefense / leagueAvg) * AWAY_ADV) };}function poissonMatrix(homeXg, awayXg, maxG = 8) {  const homeP = [], awayP = [];  for (let i = 0; i <= maxG; i++) { homeP.push(poissonPmf(i, homeXg)); awayP.push(poissonPmf(i, awayXg)); }  const matrix = [];  for (let i = 0; i <= maxG; i++) { matrix[i] = []; for (let j = 0; j <= maxG; j++) matrix[i][j] = homeP[i] * awayP[j]; }  return matrix;}function calcProbabilities(matrix) {  let homeWin = 0, draw = 0, awayWin = 0, over25 = 0, btts = 0;  for (let i = 0; i < matrix.length; i++) {    for (let j = 0; j < matrix[i].length; j++) {      const p = matrix[i][j];      if (i > j) homeWin += p; else if (i === j) draw += p; else awayWin += p;      if (i + j >= 3) over25 += p; if (i >= 1 && j >= 1) btts += p;    }  }  return { homeWin, draw, awayWin, over25, btts };}function topScorelines(matrix, n = 5) {  const list = [];  for (let i = 0; i < matrix.length; i++) for (let j = 0; j < matrix[i].length; j++) list.push({ score: `${i}-${j}`, prob: matrix[i][j] });  list.sort((a,b) => b.prob - a.prob); return list.slice(0, n);}function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); }function pct(x) { return (x * 100).toFixed(1) + '%'; }function formDots(form) { if (!form || !form.length) return '<span class="muted">—</span>'; return '<div class="form-dots">' + form.map(f => `<div class="form-dot form-${f}">${f}</div>`).join('') + '</div>'; }function predictedResult(probs) {  if (probs.homeWin >= probs.awayWin && probs.homeWin >= probs.draw) return { label: 'Home Win', cls: 'badge-home' };  if (probs.awayWin >= probs.homeWin && probs.awayWin >= probs.draw) return { label: 'Away Win', cls: 'badge-away' };  return { label: 'Draw', cls: 'badge-draw' };}function h2hSummary(h2h, teamA, teamB) {  if (!h2h || !h2h.length) return null;  let aWins = 0, bWins = 0, draws = 0, goals = 0, btts = 0, over25 = 0;  for (const m of h2h) {    const total = m.hg + m.ag; goals += total; if (m.hg > 0 && m.ag > 0) btts++; if (total >= 3) over25++;    const homeIsA = m.home === teamA;    if (m.hg === m.ag) draws++; else if ((m.hg > m.ag && homeIsA) || (m.ag > m.hg && !homeIsA)) aWins++; else bWins++;  }  const n = h2h.length;  return { n, aWins, bWins, draws, avgGoals: goals/n, bttsPct: btts/n, over25Pct: over25/n };}function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }function num(id) { const el = document.getElementById(id); return el ? (parseFloat(el.value) || 0) : 0; }const API_BASE = 'https://match-analyzer-proxy.yourname.workers.dev/?url=';async function fetchMatches(dateStr) {  const key = state.settings.apiKey;  if (!key) throw new Error('No API key. Add your key in Settings below.');  const targetUrl = `https://api.football-data.org/v4/matches?date=${dateStr}`;  const encodedUrl = encodeURIComponent(targetUrl);  const url = `${API_BASE}${encodedUrl}`;  const res = await fetch(url, {    headers: {       'X-Auth-Token': key,      'Accept': 'application/json'    }  });  if (!res.ok) {    let errorMsg = `API error ${res.status}`;    try { const errData = await res.json(); if (errData.message) errorMsg += `: ${errData.message}`; } catch(e) {}    throw new Error(errorMsg);  }  const data = await res.json();  return data.matches || [];}function mapApiMatchToFixture(m) {  const homeName = m.homeTeam?.name || m.homeTeam?.shortName || 'Home';  const awayName = m.awayTeam?.name || m.awayTeam?.shortName || 'Away';  return {    id: uid(), home: homeName, away: awayName, competition: m.competition?.name || '',    date: m.utcDate ? m.utcDate.slice(0, 10) : '',    time: m.utcDate ? new Date(m.utcDate).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '',    venue: '', homeStats: { mp:0, w:0, d:0, l:0, gf:0, ga:0, homeGf:0, homeGa:0 }, awayStats: { mp:0, w:0, d:0, l:0, gf:0, ga:0, awayGf:0, awayGa:0 },    homeForm: [], awayForm: [], h2h: [], homeInjuries: '', awayInjuries: '', homeKeyPlayer: '', awayKeyPlayer: '', odds: { home:'', draw:'', away:'' },    notes: `Fetched from football-data.org on ${new Date().toLocaleDateString()}. Match ID: ${m.id}. Status: ${m.status || 'SCHEDULED'}.`, apiId: m.id  };}async function fetchAndDisplayFixtures() {  const dateInput = document.getElementById('fetchDate');  const dateStr = dateInput ? dateInput.value : new Date().toISOString().slice(0, 10);  if (!dateStr) { setStatus('Pick a date first.', 'err'); return; }  state.loading = true; setStatus('Fetching fixtures...', 'info'); render();  try {    const matches = await fetchMatches(dateStr);    state.settings.fetchedFixtures = matches.map(mapApiMatchToFixture);    state.settings.lastFetched = dateStr; saveSettings(); state.loading = false;    setStatus(`Found ${matches.length} matches on ${dateStr}.`, 'ok');  } catch (e) { state.loading = false; setStatus(e.message, 'err'); }  render();}function importFetchedFixture(id) {  const f = state.settings.fetchedFixtures.find(x => x.id === id);  if (!f) return;  const exists = state.fixtures.find(x => x.apiId && x.apiId === f.apiId);  if (exists) { setStatus('Already imported.', 'info'); render(); return; }  state.fixtures.unshift(f); save(); setStatus(`Imported ${f.home} vs ${f.away}.`, 'ok'); render();}function setStatus(msg, type) {  state.status = { msg, type };  setTimeout(() => { if (state.status && state.status.msg === msg) { state.status = null; render(); } }, 8000);}function render() {  const app = document.getElementById('app');  if (state.view === 'list') app.innerHTML = renderList();  else if (state.view === 'detail') app.innerHTML = renderDetail();  else if (state.view === 'edit') app.innerHTML = renderEdit();  window.scrollTo(0, 0);}function renderStatus() {  if (!state.status) return '';  const cls = state.status.type === 'ok' ? 'status-ok' : state.status.type === 'err' ? 'status-err' : 'status-info';  return `<div class="status-msg ${cls}">${state.status.msg}</div>`;}function renderFetchedList() {  const list = state.settings.fetchedFixtures || [];  if (!list.length) return '';  return `<div class="card"><h3>Fetched Fixtures — ${state.settings.lastFetched || ''}</h3><div style="max-height:400px;overflow-y:auto;margin-top:8px">${list.map(f => `<div class="fetched-fixture"><div><div class="teams">${f.home} vs ${f.away}</div><div class="time">${f.competition} · ${f.time}</div></div><button class="small" onclick="importFetchedFixture('${f.id}')">Import</button></div>`).join('')}</div></div>`;}function renderList() {  const cards = state.fixtures.length ? state.fixtures.map(f => {    const xg = calcXg(f.homeStats, f.awayStats); const matrix = poissonMatrix(xg.homeXg, xg.awayXg); const probs = calcProbabilities(matrix); const pred = predictedResult(probs);    return `<div class="fixture-card" onclick="openFixture('${f.id}')"><div><div class="fixture-teams">${f.home} <span style="color:var(--muted);font-weight:400">vs</span> ${f.away}</div><div class="fixture-meta">${f.competition || ''} ${f.date ? '· ' + fmtDate(f.date) : ''} ${f.time ? '· ' + f.time : ''}</div></div><span class="badge ${pred.cls}">${pred.label} · ${pct(Math.max(probs.homeWin, probs.draw, probs.awayWin))}</span></div>`;  }).join('') : '<div class="empty"><p>No fixtures yet.</p></div>';  const today = new Date().toISOString().slice(0, 10);  return `    <header><h1>⚽ Match Analyzer</h1><button onclick="newFixture()">+ Add Fixture</button></header>    ${renderStatus()}    <div class="card">      <h3>Fetch from football-data.org</h3>      <div class="grid grid-3" style="align-items:end">        <div class="field" style="margin-bottom:0"><label>Date</label><input id="fetchDate" type="date" value="${state.settings.lastFetched || today}"></div>        <div class="field" style="margin-bottom:0"><label>API Key</label><input id="apiKeyInput" type="password" placeholder="Paste key" value="${state.settings.apiKey || ''}"></div>        <div><button onclick="saveApiKey()" style="width:100%">Save Key</button></div>      </div>      <div class="actions" style="margin-top:12px"><button onclick="fetchAndDisplayFixtures()" ${state.loading ? 'disabled' : ''}>${state.loading ? 'Fetching...' : 'Fetch Fixtures'}</button><button class="secondary" onclick="window.open('https://www.football-data.org/client/register','_blank')">Get Free API Key</button></div>    </div>    ${renderFetchedList()}    <div class="quick-add">      <textarea id="quickAdd" rows="1" placeholder="Paste fixture here (Enter to add)" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();quickAdd();}"></textarea>      <select id="quickAddFormat" onchange="saveQuickAddFormat()">        <option value="auto" ${state.settings.quickAddFormat === 'auto' ? 'selected' : ''}>Auto-detect</option>        <option value="newline" ${state.settings.quickAddFormat === 'newline' ? 'selected' : ''}>2 lines</option>        <option value="dash" ${state.settings.quickAddFormat === 'dash' ? 'selected' : ''}>- (dash)</option>        <option value="vs" ${state.settings.quickAddFormat === 'vs' ? 'selected' : ''}>vs</option>        <option value="space" ${state.settings.quickAddFormat === 'space' ? 'selected' : ''}>space</option>        <option value="tab" ${state.settings.quickAddFormat === 'tab' ? 'selected' : ''}>tab</option>      </select>      <button onclick="quickAdd()">Add</button>    </div>    <h2>My Fixtures (${state.fixtures.length})</h2>${cards}    <div class="actions" style="margin-top:20px"><button class="secondary small" onclick="exportData()">Export JSON</button><button class="secondary small" onclick="importData()">Import JSON</button><button class="danger small" onclick="clearAll()">Clear All</button></div>`;}function renderDetail() {  const f = state.fixtures.find(x => x.id === state.currentId); if (!f) { state.view = 'list'; return renderList(); }  const xg = calcXg(f.homeStats, f.awayStats); const matrix = poissonMatrix(xg.homeXg, xg.awayXg); const probs = calcProbabilities(matrix); const scores = topScorelines(matrix, 5); const h2h = h2hSummary(f.h2h, f.home, f.away); const pred = predictedResult(probs); const maxScore = Math.max(...scores.map(s => s.prob));  let heatmap = '<div class="heatmap"><div class="heatmap-cell heatmap-header"></div>';  for (let j = 0; j < 6; j++) heatmap += `<div class="heatmap-cell heatmap-header">${j}</div>`;  for (let i = 0; i < 6; i++) { heatmap += `<div class="heatmap-cell heatmap-header">${i}</div>`; for (let j = 0; j < 6; j++) { const p = matrix[i]?.[j] || 0; const lvl = p > 0.08 ? 4 : p > 0.05 ? 3 : p > 0.03 ? 2 : p > 0.015 ? 1 : 0; heatmap += `<div class="heatmap-cell heatmap-${lvl}">${(p*100).toFixed(1)}</div>`; } }  heatmap += '</div>';  return `    <button class="back-btn" onclick="backToList()">← Back to fixtures</button>${renderStatus()}    <div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><div style="font-size:20px;font-weight:700">${f.home} <span style="color:var(--muted);font-weight:400">vs</span> ${f.away}</div><div class="muted" style="margin-top:4px">${f.competition || ''} ${f.date ? '· ' + fmtDate(f.date) : ''} ${f.time ? '· ' + f.time : ''} ${f.venue ? '· ' + f.venue : ''}</div></div><span class="badge ${pred.cls}" style="font-size:13px;padding:6px 14px">${pred.label}</span></div></div>    <h2>Win Probabilities</h2><div class="card"><div class="prob-bar"><div class="prob-seg prob-home" style="width:${probs.homeWin*100}%">${pct(probs.homeWin)}</div><div class="prob-seg prob-draw" style="width:${probs.draw*100}%">${pct(probs.draw)}</div><div class="prob-seg prob-away" style="width:${probs.awayWin*100}%">${pct(probs.awayWin)}</div></div><div class="grid grid-3" style="margin-top:12px"><div><div class="muted">Over 2.5</div><div class="stat-value">${pct(probs.over25)}</div></div><div><div class="muted">BTTS</div><div class="stat-value">${pct(probs.btts)}</div></div><div><div class="muted">xG</div><div class="stat-value">${xg.homeXg.toFixed(2)} – ${xg.awayXg.toFixed(2)}</div></div></div></div>    <h2>Team Comparison</h2><div class="card"><table><tr><th>Metric</th><th>${f.home}</th><th>${f.away}</th></tr><tr><td>Record</td><td>${f.homeStats.w}-${f.homeStats.d}-${f.homeStats.l}</td><td>${f.awayStats.w}-${f.awayStats.d}-${f.awayStats.l}</td></tr><tr><td>Goals / game</td><td>${((f.homeStats.gf/(f.homeStats.mp||1))).toFixed(2)}</td><td>${((f.awayStats.gf/(f.awayStats.mp||1))).toFixed(2)}</td></tr><tr><td>Conceded / game</td><td>${((f.homeStats.ga/(f.homeStats.mp||1))).to .length === 2) return [words[0], words[1]];  return null;}function saveQuickAddFormat() { const sel = document.getElementById('quickAddFormat'); if (!sel) return; state.settings.quickAddFormat = sel.value; saveSettings(); }function quickAdd() {  const input = document.getElementById('quickAdd'); const text = input.value.trim(); if (!text) return;  const format = state.settings.quickAddFormat || 'auto'; const parsed = parseFixtureText(text, format);  if (!parsed) { const hints = { auto: 'Could not split. Try a dash or 2 lines.', newline: 'Needs exactly two lines.', dash: 'Needs a dash. Example: "Arsenal - Chelsea"', vs: 'Needs "vs". Example: "Arsenal vs Chelsea"', space: 'Needs exactly two words.', tab: 'Paste with a tab.' }; setStatus(hints[format] || 'Could not parse.', 'err'); render(); return; }  const [home, away] = parsed;  const f = { id: uid(), home, away, competition: '', date: '', time: '', venue: '', homeStats: { mp:0, w:0, d:0, l:0, gf:0, ga:0, homeGf:0, homeGa:0 }, awayStats: { mp:0, w:0, d:0, l:0, gf:0, ga:0, awayGf:0, awayGa:0 }, homeForm: [], awayForm: [], h2h: [], homeInjuries: '', awayInjuries: '', homeKeyPlayer: '', awayKeyPlayer: '', odds: { home:'', draw:'', away:'' }, notes: '' };  state.fixtures.unshift(f); save(); input.value = ''; editFixture(f.id);}function copyAnalysis(id) {  const f = state.fixtures.find(x => x.id === id); const xg = calcXg(f.homeStats, f.awayStats); const matrix = poissonMatrix(xg.homeXg, xg.awayXg); const probs = calcProbabilities(matrix); const scores = topScorelines(matrix, 3); const h2h = h2hSummary(f.h2h, f.home, f.away); const pred = predictedResult(probs);  let text = `# ${f.home} vs ${f.away}\n${f.competition || ''} ${f.date ? '| ' + fmtDate(f.date) : ''} ${f.time ? '| ' + f.time : ''}\n\n## Win Probabilities\n- ${f.home}: ${pct(probs.homeWin)}\n- Draw: ${pct(probs.draw)}\n- ${f.away}: ${pct(probs.awayWin)}\n- Over 2.5: ${pct(probs.over25)}\n- BTTS: ${pct(probs.btts)}\n- xG: ${xg.homeXg.toFixed(2)} –
