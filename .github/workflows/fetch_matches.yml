# =========================================================
# Workflow: Fetch Daily Fixtures
# Purpose: Automatically calls the football-data.org API 
#          every day at 00:05 UTC, saves the matches into 
#          today_matches.json, and commits it to the repo 
#          so the Match Analyzer app can load it instantly.
# =========================================================

name: Fetch Daily Fixtures
on:
  schedule:
    - cron: '5 0 * * *' # Runs at 00:05 UTC every day
  workflow_dispatch: # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04 # Pinned to a stable version
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5 # Updated to support Node.js 24
        
      - name: Fetch Matches from API
        run: |
          TODAY=$(date +'%Y-%m-%d')
          curl -s -H "X-Auth-Token: ${{ secrets.FOOTBALL_API_KEY }}" \
            "https://api.football-data.org/v4/matches?date=$TODAY" > today_matches.json
            
      - name: Commit and Push File
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add today_matches.json
          git commit -m "Auto-update daily matches for $TODAY" || exit 0
          git push
